plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'dev.flutter.flutter-gradle-plugin'
}

def localProperties = new Properties()
def isPerfBuild = (project.findProperty('lanAudioPerfBuild') ?: System.getenv('LAN_AUDIO_PERF_BUILD') ?: 'false').toString().toBoolean()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

android {
    namespace 'com.example.lan_audio_android_mvp'
    compileSdk flutter.compileSdkVersion
    ndkVersion '25.1.8937393'

    defaultConfig {
        applicationId 'com.example.lan_audio_android_mvp'
        minSdkVersion 24
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutter.versionCode + (isPerfBuild ? 2 : 0)
        versionName flutter.versionName
        manifestPlaceholders = [appLabel: isPerfBuild ? 'LAN Audio Perf' : 'LAN Audio']
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging false
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    signingConfigs {
        release {
            def releaseStoreFile = localProperties.getProperty("lanAudio.releaseStoreFile")
            storeFile releaseStoreFile
                ? file(releaseStoreFile)
                : file(System.getenv("LAN_AUDIO_KEYSTORE_PATH") ?: rootProject.file("../../lan-audio-release.jks"))
            storePassword localProperties.getProperty("lanAudio.releaseStorePassword")
                ?: System.getenv("LAN_AUDIO_KEYSTORE_PASS")
                ?: ""
            keyAlias localProperties.getProperty("lanAudio.releaseKeyAlias")
                ?: System.getenv("LAN_AUDIO_KEY_ALIAS")
                ?: "lan-audio"
            keyPassword localProperties.getProperty("lanAudio.releaseKeyPassword")
                ?: System.getenv("LAN_AUDIO_KEY_PASS")
                ?: ""
        }
    }

    buildTypes {
        release {
            signingConfig(isPerfBuild ? signingConfigs.debug : signingConfigs.release)
            if (isPerfBuild) {
                applicationIdSuffix '.perf'
                versionNameSuffix '-perf3'
                // Flutter's default native filters include all supported ABIs.
                // Keep JNI libraries aligned with the selected Flutter engine.
                def abiMap = ['android-arm': 'armeabi-v7a', 'android-arm64': 'arm64-v8a', 'android-x64': 'x86_64']
                ndk.abiFilters.clear()
                providers.gradleProperty('target-platform').getOrElse('android-arm64').split(',').each { platform ->
                    def abi = abiMap[platform]
                    if (abi == null) { throw new GradleException("Unsupported test APK platform: $platform") }
                    ndk.abiFilters.add(abi)
                }
            }
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    implementation "androidx.core:core:1.13.1"
    implementation "androidx.media:media:1.7.0"
    implementation "androidx.media3:media3-session:1.4.1"
    implementation "androidx.media3:media3-exoplayer:1.4.1"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
}
